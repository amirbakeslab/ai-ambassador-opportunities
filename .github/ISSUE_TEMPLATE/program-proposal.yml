name: Program proposal or correction
description: Suggest a program or a correction to the catalog
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: Use public, official sources only, and leave out personal details.
  - type: input
    id: url
    attributes:
      label: Program URL
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: For a new program, what it offers and requires. For a correction, the catalog ID and what is wrong.
    validations:
      required: true
  - type: textarea
    id: candidate
    attributes:
      label: Candidate file (optional)
      description: Output of `ambassador propose <url>`, if you have it.
      render: json
